[tool.poetry]
package-mode = false

[project]
name = "data-projects"
version = "0.1.0"
description = "Data engineering projects with Airflow ETL pipelines"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "openpyxl",
    "sqlalchemy",
    "psycopg2-binary",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "B008",   # do not perform function calls in argument defaults
    "W191",   # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ files OK
