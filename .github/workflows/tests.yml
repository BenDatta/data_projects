name: Lint and Test

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'dags/**'
      - 'tests/**'
      - 'requirements.txt'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'dags/**'
      - 'tests/**'
      - 'requirements.txt'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          
      - name: Check formatting with Ruff
        run: ruff format --check dags/ data/ tests/
          
      - name: Lint with Ruff
        run: ruff check dags/ data/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install apache-airflow pytest pytest-mock
          
      - name: Run tests
        run: pytest tests/ -v --tb=short
